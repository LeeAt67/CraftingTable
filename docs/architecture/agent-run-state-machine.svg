<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" data-quality-profile="standard">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }
  </style>
<defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16A34A"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9333EA"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#EA580C"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#DC2626"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748B"/>
    </marker>
  </defs>
<rect x="0" y="0" width="1200" height="780" fill="#FFFFFF" data-graph-role="background"/>
<text x="48" y="42" font-size="22" font-weight="600" fill="#111827" text-anchor="start">CraftingTable Agent 状态机</text>
<text x="48" y="67" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Run 与 Step 都只有一个运行态和唯一终态；取消、失败、中断不能只是停止 goroutine</text>
<rect id="Run 生命周期" x="44" y="92" width="1112" height="282" rx="12" fill="#EFF6FF" fill-opacity="0.32" stroke="#BFDBFE" stroke-width="1.25" data-graph-role="container"/>
<text x="62" y="116" font-size="13" font-weight="600" fill="#2563EB" text-anchor="start">Run 生命周期</text>
<line x1="60" y1="128" x2="1140" y2="128" stroke="#BFDBFE" stroke-width="1"/>
<rect id="Step 生命周期与 Executor 循环" x="44" y="402" width="1112" height="292" rx="12" fill="#FAF5FF" fill-opacity="0.32" stroke="#E9D5FF" stroke-width="1.25" data-graph-role="container"/>
<text x="62" y="426" font-size="13" font-weight="600" fill="#9333EA" text-anchor="start">Step 生命周期与 Executor 循环</text>
<line x1="60" y1="438" x2="1140" y2="438" stroke="#E9D5FF" stroke-width="1"/>
<circle cx="100" cy="222" r="8" fill="#111827" data-graph-role="decoration"/>
<g id="g-run-running">
<rect id="run-running" data-node-id="run-running" data-graph-role="node" x="198" y="186" width="210" height="72" rx="8" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
<rect x="208" y="198" width="26" height="26" rx="6" fill="#EFF6FF" stroke="#BFDBFE"/>
<text x="221" y="216" font-size="11" font-weight="600" fill="#2563EB" text-anchor="middle">R</text>
<text x="246" y="215" font-size="14" font-weight="600" fill="#111827" text-anchor="start">running</text>
<text x="216" y="237" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">Executor 持有 runCtx</text>
</g>
<g id="g-run-completed">
<rect id="run-completed" data-node-id="run-completed" data-graph-role="node" x="486" y="136" width="176" height="68" rx="8" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1.5"/>
<rect x="496" y="148" width="26" height="26" rx="6" fill="#F0FDF4" stroke="#BBF7D0"/>
