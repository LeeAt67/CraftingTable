<text x="246" y="545" font-size="14" font-weight="600" fill="#111827" text-anchor="start">step.running</text>
<text x="216" y="567" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">一次 model / tool / MCP</text>
</g>
<g id="g-step-completed">
<rect id="step-completed" data-node-id="step-completed" data-graph-role="node" x="470" y="474" width="176" height="68" rx="8" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1.5"/>
