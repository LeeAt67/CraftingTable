<text x="794" y="165" font-size="14" font-weight="600" fill="#111827" text-anchor="start">failed</text>
<text x="764" y="187" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">稳定错误码</text>
</g>
