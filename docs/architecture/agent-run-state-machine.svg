<text x="728" y="653" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">进程恢复扫描</text>
</g>
<g id="g-step-exhausted">
<rect id="step-exhausted" data-node-id="step-exhausted" data-graph-role="node" x="944" y="474" width="176" height="68" rx="8" fill="#FFFFFF" stroke="#FECACA" stroke-width="1.5"/>
<rect x="954" y="486" width="26" height="26" rx="6" fill="#FEF2F2" stroke="#FECACA"/>
<text x="967" y="504" font-size="11" font-weight="600" fill="#DC2626" text-anchor="middle">!</text>
<text x="992" y="503" font-size="14" font-weight="600" fill="#111827" text-anchor="start">Run failed</text>
<text x="962" y="525" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">maxSteps 耗尽</text>
