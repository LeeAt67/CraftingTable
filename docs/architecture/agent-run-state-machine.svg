<text x="764" y="311" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">进程重启清理</text>
</g>
<path id="init-run" data-edge-id="init-run" data-graph-role="edge" d="M108,222 L198,222" fill="none" stroke="#64748B" stroke-width="1.7" marker-end="url(#arrow-gray)"/>
<path id="run-complete" data-edge-id="run-complete" data-graph-role="edge" d="M408,196 L486,196" fill="none" stroke="#16A34A" stroke-width="1.7" marker-end="url(#arrow-green)"/>
<text x="447" y="188" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="middle" data-owner="run-complete">finish</text>
<path id="run-fail" data-edge-id="run-fail" data-graph-role="edge" d="M350,258 L350,370 L948,370 L948,170 L922,170" fill="none" stroke="#DC2626" stroke-width="1.7" marker-end="url(#arrow-red)"/>
<text x="366" y="286" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start" data-owner="run-fail">provider / policy error</text>
<path id="run-cancel" data-edge-id="run-cancel" data-graph-role="edge" d="M408,240 L486,240 L486,260" fill="none" stroke="#EA580C" stroke-width="1.7" marker-end="url(#arrow-orange)"/>
<text x="454" y="232" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="middle" data-owner="run-cancel">cancel</text>
<path id="run-interrupt" data-edge-id="run-interrupt" data-graph-role="edge" d="M408,258 L438,258 L438,358 L822,358 L822,328" fill="none" stroke="#64748B" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow-gray)"/>
<text x="650" y="350" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="middle" data-owner="run-interrupt">startup reconciliation</text>
<circle cx="100" cy="552" r="8" fill="#111827" data-graph-role="decoration"/>
<g id="g-step-running">
