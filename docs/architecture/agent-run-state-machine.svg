<rect x="496" y="272" width="26" height="26" rx="6" fill="#FFF7ED" stroke="#FED7AA"/>
<text x="509" y="290" font-size="11" font-weight="600" fill="#EA580C" text-anchor="middle">X</text>
<text x="534" y="289" font-size="14" font-weight="600" fill="#111827" text-anchor="start">cancelled</text>
<text x="504" y="311" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">用户主动停止</text>
</g>
<g id="g-run-interrupted">
<rect id="run-interrupted" data-node-id="run-interrupted" data-graph-role="node" x="746" y="260" width="176" height="68" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
