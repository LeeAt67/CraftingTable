<rect id="step-interrupted" data-node-id="step-interrupted" data-graph-role="node" x="710" y="602" width="176" height="68" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="720" y="614" width="26" height="26" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="733" y="632" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">I</text>
