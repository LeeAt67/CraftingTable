<path id="step-limit" data-edge-id="step-limit" data-graph-role="edge" d="M646,508 L710,508" fill="none" stroke="#DC2626" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow-red)"/>
<text x="678" y="500" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="middle" data-owner="step-limit">last step</text>
<path id="run-final-failed" data-edge-id="run-final-failed" data-graph-role="edge" d="M798,474 L798,444 L1030,444 L1030,474" fill="none" stroke="#DC2626" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow-red)"/>
<path id="step-final" data-edge-id="step-final" data-graph-role="edge" d="M974,542 L988,542 L988,594" fill="none" stroke="#64748B" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow-gray)"/>
<rect x="48" y="720" width="1104" height="34" rx="7" fill="#F8FAFC" stroke="#E5E7EB"/>
<text x="64" y="742" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">RunPolicy：maxSteps · maxDurationMs · idleTimeoutMs · maxConsecutiveFailures；所有限制都由 Executor 检查并收敛到唯一终态。</text>
<g id="legend" data-graph-role="legend">
<line x1="64" y1="772" x2="92" y2="772" stroke="#16A34A" stroke-width="1.7" marker-end="url(#arrow-green)"/>
<text x="100" y="776" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">成功</text>
<line x1="206" y1="772" x2="234" y2="772" stroke="#DC2626" stroke-width="1.7" marker-end="url(#arrow-red)"/>
<text x="242" y="776" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">失败</text>
<line x1="348" y1="772" x2="376" y2="772" stroke="#EA580C" stroke-width="1.7" marker-end="url(#arrow-orange)"/>
<text x="384" y="776" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">取消</text>
<line x1="490" y1="772" x2="518" y2="772" stroke="#64748B" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow-gray)"/>
<text x="526" y="776" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">中断</text>
</g>
</svg>
