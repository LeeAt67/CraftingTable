<rect id="run-failed" data-node-id="run-failed" data-graph-role="node" x="746" y="136" width="176" height="68" rx="8" fill="#FFFFFF" stroke="#FECACA" stroke-width="1.5"/>
<rect x="756" y="148" width="26" height="26" rx="6" fill="#FEF2F2" stroke="#FECACA"/>
