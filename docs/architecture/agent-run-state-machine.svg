<text x="534" y="165" font-size="14" font-weight="600" fill="#111827" text-anchor="start">completed</text>
<text x="504" y="187" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">最终答案已提交</text>
</g>
