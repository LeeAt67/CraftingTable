<text x="440" y="532" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="middle" data-owner="step-finish">success</text>
<path id="step-fail" data-edge-id="step-fail" data-graph-role="edge" d="M330,588 L330,690 L926,690 L926,508 L886,508" fill="none" stroke="#DC2626" stroke-width="1.7" marker-end="url(#arrow-red)"/>
<text x="366" y="632" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start" data-owner="step-fail">error</text>
